<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <div></div>
        <div class="lang-switcher" aria-label="Language selector">
          <label for="language-select" id="language-label">Language</label>
          <select id="language-select">
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </div>
      </div>
      <h1 id="app-title">Mergington High School</h1>
      <h2 id="page-subtitle">Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3 id="activities-heading">Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p id="loading-message">Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3 id="signup-heading">Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label id="email-label" for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label id="activity-label" for="activity">Select Activity:</label>
            <select id="activity" required>
              <option id="activity-placeholder" value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button id="submit-button" type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p id="footer-text">&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
